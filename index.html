<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>벽돌깨기</title>
	<link type="text/css" rel="stylesheet" href="style.css">
	<script src="main.js"></script>
	<script src="gameConfig.js"></script>
	<script src="game.js"></script>
</head>
<body>
	<section>
		<div id="initScreen">
			<div>
				<p class="title">벽돌깨기</p>
				<div id="startGameButton" class="mainBtn">게임 시작</div>
				<div id="settingButton" class="mainBtn">환경 설정</div>
			</div>
		</div>
		<div id="startGameScreen">
			<p class="text1">스테이지 설정</p>
			<img id="levelImg" src="img/boss/1.png" alt="보스이미지">
			<div id="selectLevel">
				<div class="subBtn1 selected">1단계</div>
				<div class="subBtn1">2단계</div>
				<div class="subBtn1">3단계</div>
			</div>
			
			<div class="mainBtn">게임 시작</div>
			<div class="backBtn subBtn1">뒤로가기</div>
		</div>
		<div id="storyScreen">
			<div id="gameButton" class="subBtn1">넘기기</div>
		</div>
		<div id="boostScreen">
			<p class="text1">스킬을 선택해주세요!</p>
			<div id="boosts">
			</div>
		</div>
		<div id="gameScreen">
			<p id="level" class="text2"></p>
			<div>
				<span id="bossLife" class="text2">보스 체력</span>
				<img id="bossImg" src="img/character/1.png" width="100" height="100">
			</div>
			<canvas id="canvas" width="1080" height="800"></canvas>
			<div id="userInterface">
				<div>
					<p id="life" class="text2">내 체력</p>
					<p id="count" class="text2">남은 부메랑</p>
				</div>
				<div id="skills">
				</div>
			</div>
			<div id="controlButton" class="subBtn1">start</div>
			<div class="backBtn subBtn1">종료하기</div>
		</div>
		<div id="settingScreen">
			<div>
				<div id="prevCharButton" class="subBtn1"><</div>
				<img id="characterImg" src="#" alt="캐릭터이미지">
				<div id="nextCharButton" class="subBtn1">></div>
			</div>
			<div>
				<div id="prevBallButton" class="subBtn1"><</div>
				<img id="ballImg" src="#" alt="공이미지">
				<div id="nextBallButton" class="subBtn1">></div>
			</div>

			<div class="backBtn subBtn1">뒤로가기</div>
		</div>
	</section>
	<footer>
		2026 1학기 웹프 팀프로젝트 
	</footer>
</body>
</html>
