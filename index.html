<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>링크의 벽돌깨기</title>
	<link type="text/css" rel="stylesheet" href="style.css">
	<script src="main.js"></script>
	<script src="gameConfig.js"></script>
	<script src="game.js"></script>
</head>
<body>
	<section>
		<div id="initScreen">
			<div>
				<p class="title">링크의 벽돌깨기 : 하이랄 성을 되찾아라!</p>
				<div id="startGameButton" class="mainBtn">게임 시작</div>
				<div id="settingButton" class="mainBtn">환경 설정</div>
			</div>
		</div>
		<div id="startGameScreen">
			<p class="text1">스테이지 설정</p>

			<img id="levelImg" src="img/boss/1.png" alt="보스이미지"width="200" height="200">

			<div id="selectLevel">
				<div class="subBtn1 selected">1단계</div>
				<div class="subBtn1">2단계</div>
				<div class="subBtn1">3단계</div>
			</div>
			
			<div class="mainBtn">게임 시작</div>
			<div class="backBtn subBtn1">뒤로가기</div>
		</div>
		<!-- level별 storyData를 출력하는 시나리오 화면입니다. -->
		<div id="storyScreen">
			<div id="storyPanel">
		        <h2 id="storyTitle"></h2>
		        <p id="storyContent"></p>
				<div id="stageScorePanel" class="hide">
					<h3>스테이지 점수</h3>
					<p id="scoreBreakdown"></p>
				</div>
		        <div id="gameButton" class="subBtn1"></div>
		    </div>
		</div>
		<div id="boostScreen">
			<p class="text1">스킬을 선택해주세요!</p>
			<div id="boosts">
			</div>
		</div>
		<div id="gameScreen">
			<div id="battleArea">
				<div id="bossTopArea">
					<div id="bossInfo">
						<p id="level" class="text2"></p>
						<span id="bossLife" class="text2">보스 체력</span>
					</div>

					<img id="bossImg" src="img/boss/1.png" alt="보스이미지">
				</div>

				<canvas id="canvas" width="1080" height="700"></canvas>

				<div id="userInterface">
					<div>
						<p id="life" class="text2">내 체력</p>
						<p id="count" class="text2">남은 부메랑</p>
						<p id="score" class="text2">점수 : 0</p>
					</div>
					<div id="skills"></div>
				</div>

				<div id="gameControlArea">
					<div id="controlButton" class="subBtn1">start</div>
					<div class="backBtn subBtn1">종료하기</div>
				</div>
			</div>
		</div>
		<div id="settingScreen">
			<div>
				<!-- 캐릭터 선택 미리보기입니다. 선택값은 main.js의 characterNum에 저장됩니다. -->
				<div id="prevCharButton" class="subBtn1"><</div>
				<img id="characterImg" src="img/character/character1/preview.png" alt="캐릭터이미지">
				<div id="nextCharButton" class="subBtn1">></div>
			</div>
			<div>
				<div id="prevBallButton" class="subBtn1"><</div>
				<img id="ballImg" src="img/ball/1.png" alt="공이미지">
				<div id="nextBallButton" class="subBtn1">></div>
			</div>
			<div id="bgmToggleButton" class="subBtn1">BGM ON</div>
			<div class="backBtn subBtn1">뒤로가기</div>
		</div>
	</section>
</body>
</html>
